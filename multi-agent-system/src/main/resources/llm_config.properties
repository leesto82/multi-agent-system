# LLM Configuration
# Replace with your desired model name. For the self-hosted model: hosted_vllm/DeepSeek-R1-108
llm.model_name=gemini-1.5-pro-latest

# API Key for the LLM
# Fill this with your actual API key. For the self-hosted model: sk-pcd6da59ATz77s4O30C23dC5Fc574320B37f8aA21f58637d
llm.api_key=YOUR_API_KEY_HERE

# API Base URL for the LLM
# For the self-hosted model: https://oneapi.rnd.huawei.com/v1
# Note: ADK-Java may not directly support overriding api_base for non-standard models via LlmAgent builder.
llm.api_base=https://oneapi.rnd.huawei.com/v1

# SSL Verification for LLM calls
# Set to false to disable SSL verification for local/custom endpoints.
# Note: ADK-Java may not directly support overriding SSL verification for non-standard models via LlmAgent builder.
llm.ssl_verify=false
